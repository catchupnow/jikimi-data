name: update-news

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build news.json
        run: node scripts/build-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "jikimi-bot"
          git config user.email "jikimi-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "update news $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
